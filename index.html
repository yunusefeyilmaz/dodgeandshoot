<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Dodge and Shoot</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0810" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/ui2.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="touchUI">
        <div id="joyZone"></div>
        <div id="joy"><i></i></div>
        <button id="tDash" aria-label="Dash">💨<small>DASH</small></button
        ><button id="tAct" aria-label="Etkileşim">✋<small>E</small></button>
      </div>
      <div id="rotHint">
        ↻ Daha iyi oynanış için telefonu yatay çevir
        <button id="rotX">×</button>
      </div>
      <div id="tl">
        <div id="hero">
          <div id="badge"><span id="bIco">🛡️</span><b id="bLv">1</b></div>
          <div id="vit">
            <div class="bar hp">
              <i id="hpl"></i><i id="hpf"></i><span id="hpt"></span>
            </div>
            <div class="bar xp"><i id="xpf"></i><span id="xpt"></span></div>
          </div>
        </div>
        <div id="chips">
          <span id="coins" class="chip gold"></span
          ><span id="pwr" class="chip pwr"
            ><em>⚡</em><b id="pwrN">0</b><i id="pwrD"></i
          ></span>
        </div>
        <div id="syn" class="irow"></div>
        <div id="goals"></div>
        <div id="buffs" class="irow"></div>
        <div id="tgt">
          <b id="tn"></b>
          <div class="bar"><i id="tf"></i><span id="tt"></span></div>
          <div id="ts"></div>
          <div id="te" class="irow"></div>
        </div>
      </div>
      <div id="tc">
        <div id="wave"></div>
        <div id="pips"></div>
        <div id="adaptChip" class="chip"></div>
        <div id="obj"></div>
        <div id="bossbar"><i></i><span></span></div>
        <button id="startBtn">Turu başlat <kbd>Space</kbd></button>
        <label><input type="checkbox" id="auto" /> Otomatik tur</label>
      </div>
      <div id="tr">
        <button data-p="inv">
          <b class="ic">🎒</b><span class="lbl">Envanter</span><kbd>I</kbd>
        </button>
        <button data-p="stat">
          <b class="ic">📊</b><span class="lbl">Statlar</span><kbd>C</kbd>
        </button>
        <button data-p="cls">
          <b class="ic">🎭</b><span class="lbl">Sınıflar</span><kbd>K</kbd>
        </button>
        <button data-p="pet">
          <b class="ic">🐾</b><span class="lbl">Petler</span><kbd>P</kbd>
        </button>
        <button data-p="shop">
          <b class="ic">⚒️</b><span class="lbl">Yükseltmeler</span><kbd>B</kbd>
        </button>
        <button data-p="menu">
          <b class="ic">☰</b><span class="lbl">Menü</span><kbd>Esc</kbd>
        </button>
      </div>
      <div id="side">
        <div class="panel" id="invP">
          <h4>Envanter</h4>
          <div id="invGrid"></div>
          <div id="invSel"></div>
        </div>
        <div class="panel" id="statP">
          <h4>Statlar</h4>
          <div id="statGrid"></div>
          <div id="statExtra">
            <div class="sub2">Silah</div>
            <div id="stW" class="irow"></div>
            <div class="sub2">Skiller</div>
            <div id="stS" class="irow"></div>
            <div class="sub2">Kartlar</div>
            <div id="stC" class="irow"></div>
          </div>
        </div>
        <div class="panel" id="clsP">
          <h4>Sınıflar</h4>
          <div id="clsGrid" class="slots"></div>
          <div id="clsSel"></div>
          <h4 style="margin-top: 10px">Aktif kombolar</h4>
          <div id="clsCombos"></div>
        </div>
        <div class="panel" id="petP">
          <h4>Petler</h4>
          <div id="petGrid" class="slots"></div>
          <div id="petSel"></div>
        </div>
      </div>
      <div id="skills" class="irow"></div>
      <div id="bl">
        <div id="clsRow" class="irow"></div>
        <div id="petRow" class="irow"></div>
      </div>
      <div id="banners"></div>
      <div id="quests">
        <div class="qtitle">GÖREVLER</div>
        <div id="qlist"></div>
      </div>
      <div id="toast"></div>
      <div id="ov">
        <div id="ovt"></div>
        <div id="ovs"></div>
        <div id="choices"></div>
      </div>
      <div id="menu"></div>
      <div id="pop"></div>
      <div id="tip"></div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
