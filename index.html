<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Modüler Kart Oyunu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="top">
      <span id="coins"></span><span id="wave"></span>
      <button id="startBtn">Turu başlat</button>
      <label><input type="checkbox" id="auto" /> Otomatik tur</label>
      <button id="shopBtn">Yükseltmeler</button>
    </div>
    <div id="wrap">
      <canvas id="c" width="800" height="500"></canvas>
      <div id="ov">
        <div id="ovt"></div>
        <div id="choices"></div>
      </div>
    </div>
    <div id="hud">
      <div>
        <h3>Envanter</h3>
        <div class="slots" id="inv"></div>
      </div>
      <div style="flex: 1; min-width: 200px">
        <h3>Kartlar</h3>
        <div id="cards"></div>
      </div>
      <div id="stats"></div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
